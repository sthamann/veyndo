name: Verify and publish Rust migration service
on:
  pull_request:
    paths:
      - '.github/workflows/migration-image.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'extensions/**'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  migration-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: extensions/apps/migration/Dockerfile
          load: true
          tags: veyndo-migration:test
          cache-from: type=gha,scope=migration
          cache-to: type=gha,scope=migration,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/sthamann/veyndo
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Check the actual non-root Rust runtime without source credentials or interpreters
        run: |
          docker run -d --name migration-image -p 127.0.0.1:8809:8809 \
            -e MIGRATION_GATEWAY_TOKEN=image-fixture-only-not-a-deployment-secret \
            -e 'MIGRATION_CALLBACKS={"image-fixture":{"coreUrl":"https://example.test","token":"image-fixture-only-scoped-callback"}}' \
            veyndo-migration:test
          curl --fail --retry 12 --retry-delay 2 --retry-connrefused http://127.0.0.1:8809/health
          test "$(docker inspect --format '{{.Config.User}}' migration-image)" = '65532:65532'
          docker exec migration-image sh -c '! command -v python && ! command -v python3'
      - name: Preserve image diagnostics
        if: failure()
        run: docker logs migration-image || true
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the smoke-tested source-pinned service image
        if: github.event_name == 'push'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker tag veyndo-migration:test ghcr.io/sthamann/veyndo-migration:sha-$SOURCE_SHA
          docker push ghcr.io/sthamann/veyndo-migration:sha-$SOURCE_SHA
          echo "Rust migration service: ghcr.io/sthamann/veyndo-migration:sha-$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
