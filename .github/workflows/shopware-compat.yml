name: Shopware native translation and reference
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'extensions/apps/shopware-compat/**'
      - '.github/workflows/shopware-compat.yml'
permissions:
  contents: read
concurrency:
  group: shopware-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shopware-compat
      - name: Build native owners
        run: cargo build --locked --no-default-features -p veyndo -p veyndo-shopware-native --bin veyndo --bin shopware-compat --bin shopware-native
      - name: Native translation and bounded guest execution
        run: cargo test --locked -p veyndo-shopware-native
      - name: Exercise original PHP plugins and App Scripts in an isolated cell
        run: python3 extensions/apps/shopware-compat/tests/container.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shopware-native-comparison
          path: |
            artifacts/shopware-native-result.json
            artifacts/shopware-native-original-result.json
          if-no-files-found: ignore
