name: Shopware native translation and reference
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'extensions/apps/shopware-compat/**'
      - '.github/workflows/shopware-compat.yml'
permissions:
  contents: read
concurrency:
  group: shopware-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shopware-compat
      - name: Build native owners
        run: |
          cargo build --locked --no-default-features -p veyndo --bin veyndo
          cargo build --locked --manifest-path extensions/apps/shopware-compat/Cargo.toml --target-dir target --bins
      - name: Native translation and bounded guest execution
        run: |
          cargo fmt --manifest-path extensions/apps/shopware-compat/Cargo.toml --all --check
          cargo clippy --locked --manifest-path extensions/apps/shopware-compat/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo test --locked --manifest-path extensions/apps/shopware-compat/Cargo.toml --target-dir target
      - name: Exercise original PHP plugins and App Scripts in an isolated cell
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          python3 extensions/apps/shopware-compat/tests/container.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shopware-native-comparison
          path: |
            artifacts/shopware-native-result.json
            artifacts/shopware-native-original-result.json
          if-no-files-found: ignore
