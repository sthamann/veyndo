name: Original Shopware compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shopware-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shopware-compat
      - name: Build native owners
        run: cargo build --locked --no-default-features --bin veyndo --bin shopware-compat
      - name: Exercise original PHP plugins and App Scripts in an isolated cell
        run: python3 extensions/apps/shopware-compat/tests/container.py
