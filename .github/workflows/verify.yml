name: Verify prototype
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Daily/manual full runs do not hold up the short per-change checks.
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  admission:
    runs-on: ubuntu-24.04
    outputs:
      lane: ${{ steps.scope.outputs.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install cached tools for source-only frontend checks
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Verify conservative scope, final admission and coverage helpers
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/testing/test_ci_scope.py && python3 scripts/testing/test_ci_gate.py && python3 scripts/testing/tooling_tests.py && python3 scripts/testing/test_parallel_check.py && python3 scripts/testing/test_integration_partitions.py && python3 scripts/testing/test_partition_coverage.py
      - name: Check source structure without compiling or starting test services
        run: python3 scripts/structure.py
      - run: python3 scripts/testing/documentation_hygiene.py
      - name: Check exact source inventory before compiling or integration tests
        run: python3 scripts/testing/source_inventory.py
      - name: Check reviewed source and build inputs before compiling
        run: >-
          PYTHONPATH=scripts/formal python3 -c
          'import json; from pathlib import Path; from registry import check;
          print(check(Path.cwd(), json.loads(Path("proof/manifest.json").read_text())))'
      - run: python3 scripts/testing/prompt_governance.py
        env:
          PROMPT_BASE: ${{ github.event.pull_request.base.sha }}
      - name: Select daily full verification or short per-change checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            push|pull_request)
              echo 'lane=quick' >> "$GITHUB_OUTPUT"
              echo '## Quick checks only' >> "$GITHUB_STEP_SUMMARY"
              echo 'Source structure, localization, inventories and prompt/documentation governance passed. Full tests and coverage run daily at 02:17 UTC or through Run workflow; this run does not certify full-system behavior.' >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) python3 scripts/testing/ci_scope.py ;;
          esac

  documentation:
    needs: admission
    if: needs.admission.outputs.lane == 'docs'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and validate every documentation page
        run: |
          python3 -m pip install -r site/requirements.txt
          python3 scripts/build_site.py
          python3 scripts/check_site.py

  frontend:
    needs: admission
    if: needs.admission.outputs.lane == 'frontend' || needs.admission.outputs.lane == 'full'
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.coverage.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Complete frontend verification
        run: npm ci && npm run format:check && npm run build && npm run architecture && npm run localization && npm run test:coverage
        working-directory: frontend
      - name: Enforce unchanged frontend coverage floors
        run: |
          python3 scripts/testing/coverage_report.py --frontend-only
          python3 scripts/testing/ci_gate.py stamp frontend
      - name: Preserve frontend coverage
        id: coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            frontend/coverage
            artifacts/coverage/frontend-summary.json
            artifacts/coverage/frontend-provenance.json
          if-no-files-found: warn

  native_checks:
    needs: admission
    strategy:
      fail-fast: false
      matrix:
        partition: [core, signed, pooler]
    if: needs.admission.outputs.lane == 'full'
    runs-on: ubuntu-24.04
    concurrency:
      group: verify-native-${{ matrix.partition }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      DATABASE_URL: postgres://commerce:ci-only-password@127.0.0.1:15487/commerce
      QDRANT_URL: http://127.0.0.1:16333
      MERCHANT_TOKEN: ci-only-merchant-credential-not-for-deployment
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Start standard PostgreSQL and Qdrant
        run: |
          DB_PASSWORD=ci-only-password docker compose -p veyndo up -d --wait postgres qdrant
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Preserve the preceding job's dependency-cache namespace after the split.
          shared-key: verify
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, sodium, zip
          tools: composer:v2
      - name: Install verification and offline-migration dependencies
        run: |
          python3 -m pip install -r scripts/testing/requirements.txt
          sudo apt-get update && sudo apt-get install -y pgbouncer
      - name: Verify production Rust image compile-time inputs and negative control
        run: python3 scripts/testing/image_context.py
      - run: cargo fmt --all --check && cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Instrument the real Rust unit and HTTP paths
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          echo "CARGO_LLVM_COV_TARGET_DIR=$PWD/target" >> "$GITHUB_ENV"
          CARGO_LLVM_COV_TARGET_DIR="$PWD/target" cargo llvm-cov clean --workspace
          CARGO_LLVM_COV_TARGET_DIR="$PWD/target" cargo llvm-cov show-env | python3 scripts/testing/coverage_env.py >> "$GITHUB_ENV"
      - name: Instrument native binaries and core unit tests
        run: |
          if [ "${{ matrix.partition }}" = core ]; then cargo test --locked --workspace; fi
          cargo build --locked --workspace --bins
      - name: Install pinned Lean toolchain
        if: matrix.partition == 'core'
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          lake-package-directory: proof
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
      - name: Lean production contracts, source review locks and compiled conformance
        if: matrix.partition == 'core'
        run: python3 scripts/formal.py
      - name: Reject broken policies, proof shortcuts and disconnected bindings
        if: matrix.partition == 'core'
        env:
          # Intentionally broken source variants must not inflate real-core coverage.
          LLVM_PROFILE_FILE: /tmp/commerce-mutation-%p-%m.profraw
        run: python3 scripts/formal/mutations.py
      - name: Preserve formal verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/formal-*.json
          if-no-files-found: ignore
      # Integration serves the actual frontend and locale contracts use TypeScript.
      # Rebuild locally instead of making the native lane wait for UI verification.
      - name: Build frontend assets for native integration
        run: npm ci && npm run build
        working-directory: frontend
      - name: Generated contracts and source boundaries
        run: python3 scripts/testing/operation_contracts.py --check && python3 scripts/testing/workspace_boundaries.py
      - run: composer install --working-dir=reference --no-interaction --prefer-dist
      - run: python3 scripts/differential.py && python3 scripts/context_differential.py && python3 scripts/delivery_differential.py && python3 scripts/rule_differential.py && python3 scripts/automation_registry.py && python3 scripts/automation_differential.py
      - name: Real database and local provider integration (single suite registry)
        run: |
          COVERAGE_PROCESS_START="$PWD/scripts/testing/.coveragerc" PYTHONPATH="$PWD/scripts/testing" python3 scripts/verify_integration.py --container veyndo-postgres-1 --partition ${{ matrix.partition }}
      - name: Seal raw coverage profiles for this source and partition
        run: python3 scripts/testing/partition_coverage.py pack ${{ matrix.partition }} artifacts/profiles/${{ matrix.partition }}
      - name: Preserve partition profiles
        uses: actions/upload-artifact@v4
        with:
          name: native-profiles-${{ github.sha }}-${{ matrix.partition }}
          path: artifacts/profiles
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
      - name: Preserve independent integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-logs-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.partition }}
          path: |
            artifacts/*.log
            artifacts/**/*.json
          if-no-files-found: warn

  native:
    needs: [admission, native_checks]
    if: needs.admission.outputs.lane == 'full'
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.coverage.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
      - name: Install unchanged coverage collectors
        run: |
          python3 -m pip install -r scripts/testing/requirements.txt
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          echo "CARGO_LLVM_COV_TARGET_DIR=$PWD/target" >> "$GITHUB_ENV"
          CARGO_LLVM_COV_TARGET_DIR="$PWD/target" cargo llvm-cov clean --workspace
          CARGO_LLVM_COV_TARGET_DIR="$PWD/target" cargo llvm-cov show-env | python3 scripts/testing/coverage_env.py >> "$GITHUB_ENV"
      - name: Rebuild matching coverage objects without running fixtures twice
        run: cargo test --locked --workspace --no-run && cargo build --locked --workspace --bins
      - uses: actions/download-artifact@v4
        with:
          pattern: native-profiles-${{ github.sha }}-*
          path: artifacts/partition-profiles
          merge-multiple: true
      - name: Validate and combine every partition using the official collectors
        run: |
          python3 scripts/testing/partition_coverage.py collect artifacts/partition-profiles
          mkdir -p artifacts/coverage
          cargo llvm-cov report --workspace --failure-mode any --json --output-path artifacts/coverage/rust.json
          cargo llvm-cov report --workspace --failure-mode any --html --output-dir artifacts/coverage/rust
          python3 -m coverage combine --rcfile=scripts/testing/.coveragerc
          python3 -m coverage json --rcfile=scripts/testing/.coveragerc
          python3 -m coverage html --rcfile=scripts/testing/.coveragerc
          python3 scripts/testing/ci_gate.py stamp native
      - name: Preserve combined native coverage
        id: coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage
            artifacts/partition-summary.json
          if-no-files-found: error

  # Keep this exact required check for branch protection, including failed/skipped dependencies.
  verify:
    needs: [admission, documentation, frontend, native]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reject failed, cancelled, missing or unexpectedly skipped work
        run: python3 scripts/testing/ci_gate.py jobs
        env:
          VERIFY_NEEDS: ${{ toJSON(needs) }}
      - name: Download this frontend job's immutable coverage artifact
        if: needs.admission.outputs.lane == 'frontend' || needs.admission.outputs.lane == 'full'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.frontend.outputs.artifact-id }}
          merge-multiple: true
      - name: Download this native job's immutable coverage artifact
        if: needs.admission.outputs.lane == 'full'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.native.outputs.artifact-id }}
          path: artifacts
          merge-multiple: true
      - name: Check source/run provenance and unchanged coverage policy
        if: needs.admission.outputs.lane == 'frontend' || needs.admission.outputs.lane == 'full'
        env:
          VERIFY_LANE: ${{ needs.admission.outputs.lane }}
        run: |
          python3 scripts/testing/ci_gate.py reports "$VERIFY_LANE"
          if [ "$VERIFY_LANE" = full ]; then
            python3 scripts/testing/coverage_report.py
          else
            python3 scripts/testing/coverage_report.py --frontend-only
          fi
      - name: Preserve combined coverage reports, gaps and integration logs
        if: always() && needs.admission.outputs.lane == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            frontend/coverage
            artifacts/coverage
            artifacts/integration-server.log
            artifacts/signed-pooler
          if-no-files-found: warn
      - name: State the actual verification level
        env:
          VERIFY_LANE: ${{ needs.admission.outputs.lane }}
        run: |
          if [ "$VERIFY_LANE" = quick ]; then
            echo 'Quick checks passed. No full tests or new coverage were run. The complete suite runs daily at 02:17 UTC or manually.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Complete tests and same-source coverage passed for this workflow source.' >> "$GITHUB_STEP_SUMMARY"
          fi
      # External model/payment/OAuth checks remain opt-in; these reports do not certify live credentials.
