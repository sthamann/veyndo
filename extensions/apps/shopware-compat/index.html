<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopware extensions</title>
<style>
:root{font:15px/1.5 system-ui,sans-serif;color:#182e43;background:#f4f8fc;color-scheme:light}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:clamp(18px,4vw,40px)}header{display:flex;align-items:center;gap:24px;justify-content:space-between;flex-wrap:wrap}h1{font-size:28px;letter-spacing:-.04em;margin:4px 0}h2{font-size:19px;margin:0 0 12px}p{color:#536b80;max-width:760px}.eyebrow{color:#096ac4;font-size:12px;font-weight:750;letter-spacing:.12em}button,select,input{font:inherit;border:1px solid #c9d9e8;background:white;border-radius:9px;padding:10px 14px;color:inherit}button{cursor:pointer}button:hover{border-color:#0878df;background:#eff7ff}button:disabled{opacity:.5;cursor:wait}button.primary{background:#0878df;color:white;border-color:#0878df}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #73b7f5;outline-offset:2px}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}label{display:grid;gap:5px;font-size:13px;font-weight:650}.panel{background:white;border:1px solid #dae5ef;border-radius:16px;padding:22px;margin-top:24px;box-shadow:0 4px 18px #173b5805}.meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.tag{background:#e7f3ff;color:#0963b8;border-radius:20px;padding:5px 12px;font-size:12px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;margin-top:18px}th,td{padding:14px 8px;text-align:left;border-bottom:1px solid #e8eef5}th{font-size:12px;color:#5c7288}td:last-child{display:flex;gap:8px;flex-wrap:wrap}small{color:#60758a}#status{min-height:28px;margin:16px 0;color:#075da9}#status.error{color:#b42318}.empty{padding:40px;text-align:center;color:#60758a}dialog{width:min(520px,calc(100vw - 30px));border:1px solid #d2e1ee;border-radius:18px;padding:26px;box-shadow:0 18px 90px #1234}dialog::backdrop{background:#1238}footer{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}#addresses label{margin:14px 0}#addresses input{font-size:13px;width:100%}#search{min-width:220px}ul{padding-left:20px}li{padding:6px}code{font-size:12px;overflow-wrap:anywhere}#review-title{overflow-wrap:anywhere}
</style></head><body>
<header><div><span class="eyebrow">VEYNDO · SHOPWARE</span><h1 data-t="heading"></h1><p data-t="intro"></p></div><div class="controls" id="cell-controls" hidden><label><span data-t="environment"></span><select id="cell"></select></label><button id="refresh" data-t="refresh"></button></div></header>
<div id="status" role="status" aria-live="polite"></div>
<section id="native-panel" class="panel" aria-labelledby="native-heading"><div class="meta"><h2 id="native-heading" data-t="nativeHeading"></h2><span class="tag">PHP → Wasm → Veyndo</span></div><p data-t="nativeHint"></p>
<div class="controls"><label><span data-t="sourceFolder"></span><input type="file" id="source-folder" webkitdirectory multiple></label><label><span data-t="appId"></span><input id="native-id" value="imported_shopware" pattern="[a-z0-9_]+" maxlength="48"></label><label><span data-t="version"></span><input id="native-version" value="1.0.0" maxlength="100"></label><button class="primary" id="translate" disabled data-t="analyse"></button></div><p id="native-files" role="status"></p><div id="native-result" aria-live="polite"></div><label id="native-package-label" hidden><span data-t="packageHint"></span><textarea id="native-package" readonly rows="8" style="width:100%;font:12px/1.5 ui-monospace,monospace;padding:14px;border:1px solid #c9d9e8;border-radius:9px"></textarea></label></section>
<section class="panel" data-cell-only hidden><div class="controls"><h2 data-t="extensions"></h2><input id="search" type="search"><span class="tag" id="version"></span><span class="tag" id="environment"></span></div><div class="table-wrap"><table><thead><tr><th data-t="name"></th><th data-t="type"></th><th data-t="version"></th><th data-t="state"></th><th data-t="actions"></th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="empty" hidden data-t="empty"></p></section>
<section class="panel" data-cell-only hidden><h2 data-t="original"></h2><p data-t="originalHint"></p><div id="addresses"></div></section>
<section class="panel" data-cell-only hidden><h2 data-t="history"></h2><p data-t="historyHint"></p><ul id="history"></ul></section>
<dialog id="review"><h2 id="review-title"></h2><p id="review-copy"></p><p data-t="keepData"></p><footer><button id="cancel" data-t="cancel"></button><button class="primary" id="approve" data-t="approve"></button></footer></dialog>
<script type="module" src="./app.js"></script></body></html>
