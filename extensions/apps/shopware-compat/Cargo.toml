# Independent dependency resolution keeps parser JSON/schema features out of Commerce.
[workspace]
resolver = "3"
members = ["."]

[package]
name = "veyndo-shopware-native"
version = "0.1.0"
edition = "2024"
license-file = "../../../LICENSE"
description = "Shopware extension analysis and translation into bounded native Veyndo apps"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
roxmltree = "0.21"
semver = "1.0.28"
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
ring = "0.17.14"
bumpalo = "3"
mago-syntax = "=1.30.0"
mago-syntax-core = "=1.30.0"
mago-database = "=1.30.0"
mago-span = "=1.30.0"
# Mago's pre-2.0 crates use caret dependencies across incompatible minor APIs.
mago-text-edit = "=1.30.0"
mago-php-version = "=1.30.0"

[dev-dependencies]
veyndo-apps = { path = "../../../crates/apps" }

[[bin]]
name = "shopware-native"
path = "native/src/main.rs"

[[bin]]
name = "shopware-compat"
path = "service/main.rs"

[lib]
path = "native/src/lib.rs"

[[test]]
name = "translation"
path = "native/tests/translation.rs"

[[test]]
name = "parser_admission"
path = "native/tests/parser_admission.rs"
